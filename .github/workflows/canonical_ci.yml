name: Canonical CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  fail_on_protected_path_changes:
    name: "Check fork does not change protected paths"
    uses: ./.github/workflows/canonical_check_protected_paths.yml

  get_changed_directories_list:
    name: Get List Of Changed Directories
    runs-on: ubuntu-latest
    outputs:
      connectors_list_json: ${{ steps.detect-changes.outputs.connectors_list_json }}
    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Detect changed connectors
        id: detect-changes
        uses: ./.github/actions/detect-changes
        with:
          base_commit: ${{ github.event.pull_request.base.sha }}
          head_commit: ${{ github.event.pull_request.head.sha }}

  connectors_full_ci:
    name: Run connectors full CI on fork
    if: github.event.pull_request.head.repo.fork == true && needs.get_changed_directories_list.outputs.connectors_list_json != '[]'
    needs: [fail_on_protected_path_changes, get_changed_directories_list]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.get_changed_directories_list.outputs.connectors_list_json) }}

    steps:
      - name: Checkout fork with full history
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Resolve connector language
        id: vars
        run: |
          if [ -z "${{ matrix.dir }}" ]; then
            echo "No directory specified in matrix.dir, skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          METADATA="airbyte-integrations/connectors/${{ matrix.dir }}/metadata.yaml"
          # Java connectors need a different build/test path than Python/manifest connectors.
          if grep -qE '^\s*-\s*language:java' "$METADATA"; then
            LANGUAGE=java
          else
            LANGUAGE=python
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "language=$LANGUAGE" >> "$GITHUB_OUTPUT"
          echo "Detected language '$LANGUAGE' for connector '${{ matrix.dir }}'."

      # -------------------- Java connectors --------------------
      # Build/test with Gradle on JDK 21, required by the io.airbyte.gradle.docker plugin (>=0.63.0).
      - name: Set up Java 21 environment
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language == 'java'
        uses: ./.github/actions/install-java-environment
        with:
          java_version: "21"

      - name: Test and build Java connector ${{ matrix.dir }}
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language == 'java'
        run: |
          echo "🔄 Running Gradle unit tests and tarball build for connector: ${{ matrix.dir }}"
          ./gradlew \
            ":airbyte-integrations:connectors:${{ matrix.dir }}:test" \
            ":airbyte-integrations:connectors:${{ matrix.dir }}:distTar"

      # -------------------- Python / manifest connectors --------------------
      # Uses the same `poe` tasks as upstream's Connector CI (poe-tasks/*.toml), which replaced the
      # removed airbyte-ci/Dagger pipeline: https://github.com/airbytehq/airbyte/pull/75935
      # Integration/acceptance tests need connector secrets and stay skipped.
      - name: Set up Python
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        uses: astral-sh/setup-uv@v6

      - name: Install Poetry and Poe
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        run: |
          uv tool install poetry==1.8.5
          uv tool install poethepoet

      - name: Install connector dependencies
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        working-directory: airbyte-integrations/connectors/${{ matrix.dir }}
        run: poe install

      - name: Run unit tests
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        working-directory: airbyte-integrations/connectors/${{ matrix.dir }}
        run: poe test-unit-tests

      # `poe test-unit-tests` only runs manifest-only unit tests that have a `unit_tests/pyproject.toml`;
      # some Canonical connectors (e.g. source-skillsbase) use `unit_tests/requirements.txt` instead.
      - name: Run unit tests from unit_tests/requirements.txt
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        working-directory: airbyte-integrations/connectors/${{ matrix.dir }}
        run: |
          set -euo pipefail
          if [ -f unit_tests/requirements.txt ] && [ ! -f unit_tests/pyproject.toml ] && [ ! -f pyproject.toml ]; then
            python -m venv "$RUNNER_TEMP/unit-tests-venv"
            "$RUNNER_TEMP/unit-tests-venv/bin/pip" install -r unit_tests/requirements.txt
            "$RUNNER_TEMP/unit-tests-venv/bin/python" -m pytest unit_tests
          else
            echo "No unit_tests/requirements.txt-based unit tests; skipping."
          fi

      - name: Build connector image ${{ matrix.dir }}
        if: steps.vars.outputs.run == 'true' && steps.vars.outputs.language != 'java'
        working-directory: airbyte-integrations/connectors/${{ matrix.dir }}
        run: airbyte-cdk image build
