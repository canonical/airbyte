documentationUrl: https://docs.airbyte.com/integrations/sources/expensify
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Expensify Spec
  type: object
  required:
    - partner_user_id
    - partner_user_secret
    - start_date
  additionalProperties: true
  properties:
    partner_user_id:
      type: string
      title: Partner User ID
      description: The Partner User ID, generated from the Expensify Integration Server credentials page.
      order: 0
    partner_user_secret:
      type: string
      title: Partner User Secret
      description: The Partner User Secret, generated from the Expensify Integration Server credentials page.
      airbyte_secret: true
      order: 1
    start_date:
      type: string
      title: Start Date
      description: >-
        The start date (inclusive) used to filter Expensify reports for export, in the format
        YYYY-MM-DD. If you change this (or `end_date`) on a connection that has already synced
        before, it is recommended to run a full refresh (reset the stream's state) rather than
        an incremental sync, since incremental syncs only look back a limited
        window from the last synced cursor and may not otherwise pick up data now in scope.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      examples:
        - "2026-08-30"
      order: 2
    end_date:
      type: string
      title: End Date
      description: >-
        The end date (inclusive) used to filter Expensify reports for export, in the format
        YYYY-MM-DD. If left unset, there is no upper bound and reports are exported up to the
        current date.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      examples:
        - "2026-08-31"
      order: 3
    report_state:
      type: array
      title: Report State
      description: >-
        One or more Expensify report states to include in the export: "OPEN", "SUBMITTED",
        "APPROVED", "REIMBURSED", "ARCHIVED". If left unset, reports in all states are included.
      items:
        type: string
        enum:
          - OPEN
          - SUBMITTED
          - APPROVED
          - REIMBURSED
          - ARCHIVED
      order: 4
    lookback_window_days:
      type: integer
      title: Lookback Window (days)
      description: >-
        Expensify has no native "last updated" column, so incremental syncs resume the export
        window from the last synced report's created/submitted date.This setting
        trails the resumed export window back by this many days on every incremental sync so
        updated reports within this window are re-exported and re-synced.
      minimum: 0
      default: 30
      examples:
        - 30
      order: 5
