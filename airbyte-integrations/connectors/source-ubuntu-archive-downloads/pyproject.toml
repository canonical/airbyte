[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
version = "0.1.0"
name = "source-ubuntu-archive-downloads"
description = "Source that reads Ubuntu archive access logs from Swift and emits one record per matching package download."
authors = ["MaryannGitonga <naygitonga4@gmail.com>"]
readme = "README.md"
homepage = "https://airbyte.com"
repository = "https://github.com/canonical/airbyte"
[[tool.poetry.packages]]
include = "source_ubuntu_archive_downloads"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
airbyte-cdk = ">=7.28.3,<8.0.0"
python-swiftclient = "^4.6.0"
python-keystoneclient = "^5.5.0"  # not imported here, but swiftclient needs it for Keystone v3 auth

[tool.poetry.scripts]
source-ubuntu-archive-downloads = "source_ubuntu_archive_downloads.run:run"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
ruff = "0.8.3"


[tool.poe]
include = [
    # Shared tasks definition file(s) can be imported here.
    # Run `poe` or `poe --help` to see the list of available tasks.
    "${POE_GIT_DIR}/poe-tasks/poetry-connector-tasks.toml",
]
